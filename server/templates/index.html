<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detect Fake Jobs</title>
    <link rel="stylesheet" href="./static/style.css">
</head>
<body>

    <div class="container">
        <h1>🕵️ Fake Job Detector</h1>

        <div class="input-section">
            <label for="jobText">Paste Job Description</label>
            <textarea id="jobText" placeholder="Enter job posting text here..."></textarea>
        </div>

        <div class="features-grid">
            <label class="chip"><input type="checkbox" id="telecommuting"> 🏠 Remote</label>
            <label class="chip"><input type="checkbox" id="hasLogo"> 🖼️ Company Logo</label>
            <label class="chip"><input type="checkbox" id="hasQuestions"> ❓ Interview Questions</label>
        </div>

        <button class="detect-btn">Analyze Posting</button>

        <div class="result-box">
            <h2>🔹 Analysis Result</h2>
            <div class="result-content">
                <p><strong>Prediction:</strong> <span id="prediction">Pending...</span></p>
                <div class="stats">
                    <div class="stat-item">Real: <span id="realProb">0%</span></div>
                    <div class="stat-item">Fake: <span id="fakeProb">0%</span></div>
                </div>
                <p><strong>Risk Level:</strong> <span id="risk">N/A</span></p>
            </div>
        </div>

        <div class="github-connect">
            <p>Help improve the detection algorithm</p>
            <a href="https://github.com/rohanparvej/job-detector" class="gh-link">
                <svg height="20" width="20" viewBox="0 0 16 16" fill="white"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                Contribute on GitHub
            </a>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-line"></div>
        <div class="footer-content">
            <div class="dev-info">
                <span class="dev-name">job-detector 2026 <strong>open source</strong></span>
                <span class="dot">•</span>
                <span class="tech-stack">Built with ML & Web Tech</span>
            </div>
            <div class="footer-links">
                <a href="https://github.com/rohanparvej/job-detector">Star repo on github ⭐</a>
            </div>
        </div>
    </footer>

    <script src="./static/script.js"></script>
</body>
</html>
